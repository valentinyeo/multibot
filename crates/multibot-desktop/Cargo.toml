[package]
name = "multibot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "multibot"
path = "src/main.rs"

[dependencies]
alacritty_terminal.workspace = true
anyhow.workspace = true
chrono.workspace = true
multibot-core.workspace = true
multibot-gpu.workspace = true
multibot-keys.workspace = true
multibot-proto.workspace = true
multibot-updater.workspace = true
portable-pty.workspace = true
sysinfo.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "syntect"] }
# Computer View backend (MBRU-7). Windows only: it is WebView2, which is the
# adapter-neutral child-window webview Microsoft ships with Windows. Default
# features stay off so no Linux/macOS webkit or GTK build sneaks into the
# Windows dependency graph.
wry = { version = "0.58", default-features = false }

[target.'cfg(not(target_os = "windows"))'.dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "syntect", "x11"] }
# Computer View has no webview on Linux/macOS in this slice: the pane renders its
# dark preview surface instead, so no webkit or GTK dependency is added.

[dev-dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "syntect", "test-support"] }
