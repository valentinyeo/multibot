name: CI & Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux Test & Build multibotd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux GPUI dev libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig1-dev libwayland-dev pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run full workspace tests (including headless GPUI Kit UI tests)
        run: cargo test --workspace

      - name: Build release multibotd (Linux x86_64)
        run: cargo build --release -p multibotd

      - name: Stage multibotd binary
        run: |
          mkdir -p dist
          cp target/release/multibotd dist/multibotd-linux-x86_64
          ls -lh dist/multibotd-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: multibotd-linux-x86_64
          path: dist/multibotd-linux-x86_64

  windows:
    name: Windows Fast Test & Build multibot.exe
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Exclude build dirs from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run fast non-GPUI tests on Windows
        run: cargo test -p multibot-proto -p multibot-gpu -p multibot-keys -p multibot-core -p multibotd

      - name: Build release multibot.exe (single GPUI compile, iGPU-locked DXGI patch)
        run: cargo build --release -p multibot-desktop

      - name: Download multibotd-linux-x86_64 for auto-deploy bundle
        uses: actions/download-artifact@v8
        with:
          name: multibotd-linux-x86_64
          path: dist

      - name: Stage Windows portable bundle
        shell: pwsh
        run: |
          Copy-Item target/release/multibot.exe dist/multibot.exe
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: multibot-windows-x64
          path: dist/
